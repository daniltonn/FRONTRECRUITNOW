<div class="container mt-4">

  <!-- BOTÓN NUEVA VACANTE -->
  <div class="mb-3">
    <button type="button" class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#modalNuevaVacante">
      Registrar vacante
    </button>
  </div>

  <!-- TABLA -->
  <div class="table-responsive">
    <table class="table table-striped table-sm">
      <thead>
        <tr>
          <th>Título</th>
          <th>Ubicación</th>
          <th>Salario</th>
          <th>Experiencia</th>
          <th>Requisitos</th>
          <th>NBC</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>
        @for (item of vacanteList; track item._id) {
          <tr>
            <td>{{ item.titulo }}</td>
            <td>{{ item.ubicacion }}</td>
            <td>{{ item.salario }}</td>
            <td>{{ item.experienciaRequerida }}</td>
            <td>{{ item.requisitosEstudio }}</td>
            <td>{{ item.NBC }}</td>

            <td>
              <button class="btn btn-primary btn-sm me-2"
                      (click)="toggleEditVacante(item._id)">
                <i class="bi bi-pencil-square"></i>
              </button>

              <button class="btn btn-danger btn-sm"
                      (click)="deleteVacanteEntry(item._id)">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <!-- FORMULARIO EDICIÓN -->
  <form *ngIf="editableVacante"
        class="card p-3 mt-4"
        (ngSubmit)="updateVacanteEntry()"
        [formGroup]="vacanteForm">

    <h5 class="mb-3">Editar vacante</h5>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label>Título</label>
        <input type="text" class="form-control" formControlName="titulo">
      </div>

      <div class="col-md-6 mb-3">
        <label>Ubicación</label>
        <input type="text" class="form-control" formControlName="ubicacion">
      </div>

      <div class="col-md-6 mb-3">
        <label>Salario</label>
        <input type="text" class="form-control" formControlName="salario">
      </div>

      <div class="col-md-6 mb-3">
        <label>Experiencia requerida</label>
        <input type="text" class="form-control" formControlName="experienciaRequerida">
      </div>

      <div class="col-md-6 mb-3">
        <label>Requisitos de estudio</label>
        <input type="text" class="form-control" formControlName="requisitosEstudio">
      </div>

      <div class="col-md-6 mb-3">
        <label>NBC</label>
        <input type="text" class="form-control" formControlName="NBC">
      </div>

      <div class="col-12 mb-3">
        <label>Descripción</label>
        <textarea class="form-control" rows="3" formControlName="descripcion"></textarea>
      </div>
    </div>

    <div class="text-center">
      <button class="btn btn-primary" type="submit">Guardar cambios</button>
    </div>

  </form>

</div>



<!-- MODAL NUEVA VACANTE -->
<div class="modal fade" id="modalNuevaVacante" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Registrar vacante</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        
        <form (ngSubmit)="newVacanteEntry()" [formGroup]="vacanteForm">

          <div class="row">

            <div class="col-md-6 mb-3">
              <label>Título</label>
              <input type="text" class="form-control" formControlName="titulo">
            </div>

            <div class="col-md-6 mb-3">
              <label>Ubicación</label>
              <input type="text" class="form-control" formControlName="ubicacion">
            </div>

            <div class="col-md-6 mb-3">
              <label>Salario</label>
              <input type="text" class="form-control" formControlName="salario">
            </div>

            <div class="col-md-6 mb-3">
              <label>Experiencia requerida</label>
              <input type="text" class="form-control" formControlName="experienciaRequerida">
            </div>

            <div class="col-md-6 mb-3">
              <label>Requisitos de estudio</label>
              <input type="text" class="form-control" formControlName="requisitosEstudio">
            </div>

            <div class="col-md-6 mb-3">
              <label>NBC</label>
              <input type="text" class="form-control" formControlName="NBC">
            </div>

            <div class="col-12 mb-3">
              <label>Descripción</label>
              <textarea class="form-control" rows="3" formControlName="descripcion"></textarea>
            </div>

          </div>

          <div class="text-center">
            <button class="btn btn-primary" data-bs-dismiss="modal">Guardar</button>
          </div>

        </form>
