<div class="container">
    <div class="row justify-content-center">

        <div class="col-xl-10 col-lg-12 col-md-9">

            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-0">

                    <div class="row">
                        <div class="col-lg-6 d-none d-lg-block bg-login-image"></div>

                        <div class="col-lg-6">
                            <div class="p-5">

                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Bienvenidos</h1>
                                </div>

                                <form class="user" #f="ngForm" (ngSubmit)="onLogin(f)">

                                    <div class="form-group">
                                        <input type="email" class="form-control form-control-user" name="email" ngModel
                                            required placeholder="Escriba correo">
                                    </div>

                                    <div class="form-group">
                                        <input type="password" class="form-control form-control-user" name="contrasena"
                                            ngModel required placeholder="Escriba clave">
                                    </div>

                                    <button class="btn btn-primary btn-user btn-block">
                                        Iniciar sesión
                                    </button>

                                </form>

                                <hr>

                                <div class="text-center mt-3">
                                    <a routerLink="/signup" class="btn btn-link">
                                        Crear una cuenta
                                    </a>
                                </div>


                            </div>
                        </div>

                    </div>

                </div>
            </div>

        </div>

    </div>
</div>
